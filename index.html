<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doacao de sangue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="azul"><h1>Sistema de doação de sangue</h1></div>
    <br>

    <form id="doacao">

        <div class="fundo">
            
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="digite seu nome" required>
            <br>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="digite seu email" required>
            <br>
            <label for="idade">data de nascimento</label>
            <input type="date" id="idade" placeholder="digite sua date de nascimento" required>
            <br>
            <label for="peso">peso</label>
            <input type="number" id="peso" placeholder="digite seu peso" required>
            <br>
            <label for="tipo">tipo sanguínio</label>
            <select name="tipo" id="tipo" required>
                <option value="" disabled selected>Selecione</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>

            </select>
            <br>
            <label for="tel">Telefone</label>
            <input type="tel" id="tel" placeholder="digite seu telefone" required>
            <br>
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" placeholder="digite sua cidade" required>
            <br>
            <label for="estado">Estado</label>
            <input type="text" id="estado" placeholder="digite seu estado" required>




        </div>

    </form>
</body>
</html>
